name: Push wheel

# https://help.github.com/en/actions/reference/events-that-trigger-workflows
on:  # Trigger the workflow on push or pull request, but only for the main branch
  push:
    branches: [main, "release/*"]
    tags: ["*"]
  pull_request:
    branches: [main]
  release:
    types: [published]


jobs:
  # based on https://github.com/pypa/gh-action-pypi-publish
  build-package:
    runs-on: "ubuntu-22.04"
    timeout-minutes: 10
    # IMPORTANT: this permission is mandatory for Trusted Publishing
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.8"
        cache: "pip"

    - name: Install dependencies
      run: pip install -U setuptools wheel build

    - name: Overview Readme for release
      run: echo "# Lit Logger" > README.md

    - name: Build packages
      run: |
        # todo: add sdist once public
        python -m build --wheel
        ls -lh dist/

    - name: Upload to release
      if: ${{ github.event_name == 'release' }}
      continue-on-error: true
      uses: AButler/upload-release-assets@3d6774fae0ed91407dc5ae29d576b166536d1777 # v3.0
      with:
        files: "dist/*"
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    # We do this, since failures on test.pypi aren't that bad
    # TODO: add back once ownership is transferred
    # - name: Publish to Test PyPI
    #   if: startsWith(github.event.ref, 'refs/tags')
    #   uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
    #   with:
    #     repository_url: https://test.pypi.org/legacy/
    #     verbose: true

    - name: Publish distribution 📦 to PyPI
      if: startsWith(github.event.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
      with:
        user: __token__
        password: ${{ secrets.pypi_password }}
