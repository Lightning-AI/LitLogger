name: Push wheel

# https://help.github.com/en/actions/reference/events-that-trigger-workflows
on:  # Trigger the workflow on push or pull request, but only for the main branch
  push:
    branches: [main, "release/*"]
    tags: ["*"]
  pull_request:
    branches: [main]
  release:
    types: [published]


jobs:
  # based on https://github.com/pypa/gh-action-pypi-publish
  build-package:
    runs-on: "ubuntu-22.04"
    timeout-minutes: 10
    # IMPORTANT: this permission is mandatory for Trusted Publishing
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: pip install -U setuptools wheel build

    - name: Build packages
      run: |
        # todo: add sdist once public
        python -m build --wheel
        ls -lh dist/

    - name: Upload to release
      if: ${{ github.event_name == 'release' }}
      continue-on-error: true
      uses: AButler/upload-release-assets@3d6774fae0ed91407dc5ae29d576b166536d1777 # v3.0
      with:
        files: "dist/*"
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    # We do this, since failures on test.pypi aren't that bad
    # TODO: add back once ownership is transferred
    # - name: Publish to Test PyPI
    #   if: startsWith(github.event.ref, 'refs/tags')
    #   uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
    #   with:
    #     repository_url: https://test.pypi.org/legacy/
    #     verbose: true

    - name: Publish distribution 📦 to PyPI
      if: github.event_name == 'release'
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
