name: teamspace integration

on:
  push:
    branches: ["main"]
  release:
    types:
      - created
  pull_request:
    types: [ opened, reopened, ready_for_review, synchronize ]  # added `ready_for_review` since draft is skipped

jobs:
  cpu:
    runs-on: ${{ matrix.os }}
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.11", "3.12", "3.13"]
        requires: ["latest"]
        include:
          - python-version: "3.11"
            requires: "oldest"
            os: "ubuntu-latest"

    timeout-minutes: 20
    env:
      LIGHTNING_CLOUD_URL: https://staging.gridai.dev
      UV_EXCLUDE_NEWER: "2 days"
      UV_TORCH_BACKEND: cpu

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Install uv and setup python
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        activate-environment: true
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Set min. dependencies
      if: matrix.requires == 'oldest'
      run: |
        uv pip install 'lightning-utilities[cli]>=0.15.1'
        uv run python -m lightning_utilities.cli requirements set-oldest --req_files=pyproject.toml

    - name: Install dependencies
      run: |
        uv sync --group tests
        uv pip list

    - name: Set Auth Credentials
      shell: bash
      run: |
        echo "LIGHTNING_USER_ID=${{ secrets.LIGHTNING_STAGING_USER_ID }}" >> $GITHUB_ENV
        echo "LIGHTNING_API_KEY=${{ secrets.LIGHTNING_STAGING_API_KEY }}" >> $GITHUB_ENV

    - name: Tests
      working-directory: tests/
      run: |
        uv run pytest integrations/ -vvs

  guardian-integration-tests:
    runs-on: ubuntu-latest
    needs: cpu
    if: always()
    steps:
    - run: echo "${{ needs.cpu.result }}"
    - name: failing...
      if: needs.cpu.result == 'failure'
      run: exit 1
    - name: cancelled or skipped...
      if: contains(fromJSON('["cancelled", "skipped"]'), needs.cpu.result)
      timeout-minutes: 1
      run: sleep 90
